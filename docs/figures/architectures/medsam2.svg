<rect width="100%" height="100%" rx="10" fill="#FFFFFF"/>
<text x="24.0" y="34.0" font-size="19" text-anchor="start" fill="#14213D" font-weight="600">Prompted segmentation (annotation toolkit) · MedSAM2 fine-tune of SAM2 Hiera-tiny</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" fill="#5B6478">3 × 1024 × 1024 image + box  →  1 × 256 × 256 mask logits · 31.4 M parameters used (38.9 M in the checkpoint)</text>
<rect x="240" y="80" width="640" height="300" rx="9" fill="#F6F7F9" stroke="#E3E6EC"/>
<text x="252.0" y="99.0" font-size="10.5" text-anchor="start" fill="#5B6478" font-weight="600">IMAGE ENCODER</text>
<text x="868.0" y="99.0" font-size="10.5" text-anchor="end" fill="#5B6478">Hiera-T trunk 26.8 M + FPN neck 0.4 M</text>
<rect x="30" y="500" width="500" height="150" rx="9" fill="#F6F7F9" stroke="#E3E6EC"/>
<text x="42.0" y="519.0" font-size="10.5" text-anchor="start" fill="#5B6478" font-weight="600">PROMPT ENCODER (FROZEN)</text>
<rect x="560" y="500" width="710" height="210" rx="9" fill="#F6F7F9" stroke="#E3E6EC"/>
<text x="572.0" y="519.0" font-size="10.5" text-anchor="start" fill="#5B6478" font-weight="600">MASK DECODER</text>
<text x="1258.0" y="519.0" font-size="10.5" text-anchor="end" fill="#5B6478">4.2 M</text>
<rect x="30" y="96" width="190" height="50" rx="6" fill="#F3F1EC" stroke="#8A93A6" stroke-width="1.2"/>
<text x="40.0" y="111.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Input image</text>
<text x="40.0" y="126.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">3 × 1024 × 1024</text>
<text x="40.0" y="139.5" font-size="11" text-anchor="start" fill="#5B6478">raw1024</text>
<rect x="260" y="110" width="130" height="50" rx="6" fill="#E7ECF5" stroke="#2A3B66" stroke-width="1.2"/>
<text x="270.0" y="132.0" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Patch embed</text>
<text x="270.0" y="146.5" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">7×7, s4</text>
<rect x="410" y="110" width="210" height="60" rx="6" fill="#EEE8F6" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="420.0" y="130.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Stage 1 · 1 block</text>
<text x="420.0" y="145.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">96 × 256 × 256</text>
<text x="420.0" y="158.5" font-size="11" text-anchor="start" fill="#5B6478">window 8</text>
<rect x="410" y="200" width="210" height="60" rx="6" fill="#EEE8F6" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="420.0" y="220.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Stage 2 · 2 blocks</text>
<text x="420.0" y="235.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">192 × 128 × 128</text>
<text x="420.0" y="248.5" font-size="11" text-anchor="start" fill="#5B6478">window 4</text>
<rect x="650" y="110" width="210" height="60" rx="6" fill="#EEE8F6" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="660.0" y="130.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Stage 3 · 7 blocks</text>
<text x="660.0" y="145.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">384 × 64 × 64</text>
<text x="660.0" y="158.5" font-size="11" text-anchor="start" fill="#5B6478">window 14 · 3 global</text>
<rect x="650" y="200" width="210" height="60" rx="6" fill="#EEE8F6" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="660.0" y="220.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Stage 4 · 2 blocks</text>
<text x="660.0" y="235.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">768 × 32 × 32</text>
<text x="660.0" y="248.5" font-size="11" text-anchor="start" fill="#5B6478">window 7</text>
<rect x="410" y="290" width="450" height="70" rx="6" fill="#E1F0EF" stroke="#0E7C7B" stroke-width="1.2"/>
<text x="420.0" y="315.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">FPN neck · 1×1 lateral → 256, top-down at the two coarse levels</text>
<text x="420.0" y="330.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">levels kept: 256 × 256², 256 × 128², 256 × 64²</text>
<text x="420.0" y="343.5" font-size="11" text-anchor="start" fill="#5B6478">coarsest (32²) dropped (scalp 1)</text>
<rect x="240" y="410" width="290" height="60" rx="6" fill="#E7ECF5" stroke="#2A3B66" stroke-width="1.2"/>
<text x="250.0" y="430.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Image embedding</text>
<text x="250.0" y="445.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">256 × 64 × 64</text>
<text x="250.0" y="458.5" font-size="11" text-anchor="start" fill="#5B6478">64² level + no-memory embedding</text>
<rect x="560" y="410" width="320" height="60" rx="6" fill="#E1F0EF" stroke="#0E7C7B" stroke-width="1.2"/>
