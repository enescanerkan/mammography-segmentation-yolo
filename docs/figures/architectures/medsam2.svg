<rect x="262" y="528" width="250" height="54" rx="6" fill="#EEF0F3" stroke="#8A93A6" stroke-width="1.2"/>
<text x="272.0" y="545.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Dense prompt + positional enc.</text>
<text x="272.0" y="560.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">256 × 64 × 64 each</text>
<text x="272.0" y="573.5" font-size="11" text-anchor="start" fill="#5B6478">added to / used with the embedding</text>
<rect x="262" y="594" width="250" height="40" rx="6" fill="#EEF0F3" stroke="#8A93A6" stroke-width="1.2"/>
<text x="272.0" y="611.0" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Sparse tokens</text>
<text x="272.0" y="625.5" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">3 × 256 (2 corners + pad)</text>
<rect x="50" y="586" width="175" height="56" rx="6" fill="#F6E3E0" stroke="#B03A2E" stroke-width="1.2"/>
<text x="60.0" y="604.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Box prompt</text>
<text x="60.0" y="619.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">(x0, y0, x1, y1)</text>
<text x="60.0" y="632.5" font-size="11" text-anchor="start" fill="#5B6478">2 corners, labels 2 / 3</text>
<rect x="580" y="536" width="200" height="60" rx="6" fill="#F8EDDB" stroke="#B9771A" stroke-width="1.2"/>
<text x="590.0" y="556.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Output tokens</text>
<text x="590.0" y="571.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">obj-score · IoU · 4 mask</text>
<text x="590.0" y="584.5" font-size="11" text-anchor="start" fill="#5B6478">+ prompt tokens</text>
<rect x="810" y="530" width="210" height="72" rx="6" fill="#EEE8F6" stroke="#6B4FA0" stroke-width="1.2"/>
<text x="820.0" y="556.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Two-way transformer ×2</text>
<text x="820.0" y="571.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">256-d · 8 heads · MLP 2048</text>
<text x="820.0" y="584.5" font-size="11" text-anchor="start" fill="#5B6478">tokens ↔ image attention</text>
<rect x="1050" y="530" width="200" height="72" rx="6" fill="#E1F0EF" stroke="#0E7C7B" stroke-width="1.2"/>
<text x="1060.0" y="550.0" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Upscaling</text>
<text x="1060.0" y="564.5" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">ConvT ×2 → 64 × 128²</text>
<text x="1060.0" y="578.0" font-size="11" text-anchor="start" fill="#5B6478">+ s1, ConvT ×2 → 32 × 256²</text>
<text x="1060.0" y="591.0" font-size="11" text-anchor="start" fill="#5B6478">+ s0</text>
<rect x="810" y="632" width="210" height="58" rx="6" fill="#F8EDDB" stroke="#B9771A" stroke-width="1.2"/>
<text x="820.0" y="651.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Hypernetwork MLP</text>
<text x="820.0" y="666.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">mask token → 32 weights</text>
<text x="820.0" y="679.5" font-size="11" text-anchor="start" fill="#5B6478">IoU + object-score heads</text>
<rect x="1050" y="632" width="200" height="58" rx="6" fill="#F3F1EC" stroke="#8A93A6" stroke-width="1.2"/>
<text x="1060.0" y="651.5" font-size="12.5" text-anchor="start" fill="#14213D" font-weight="600">Mask logits</text>
<text x="1060.0" y="666.0" font-size="11" text-anchor="start" fill="#5B6478" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">1 × 256 × 256</text>
<text x="1060.0" y="679.5" font-size="11" text-anchor="start" fill="#5B6478">single mask (multimask off)</text>
