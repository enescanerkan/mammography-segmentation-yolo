<text x="28.0" y="735.0" font-size="11.5" text-anchor="start" fill="#5B6478">SAM2 (Hiera-tiny, configuration sam2_hiera_t) fine-tuned through the MedSAM2 branch of the MedSAM code base: image encoder and mask decoder trained, prompt encoder frozen.</text>
<text x="28.0" y="752.0" font-size="11.5" text-anchor="start" fill="#5B6478">The box enters as its two corners (point labels 2 and 3). Hiera blocks use windowed attention (window 8 / 4 / 14 / 7 per stage) except three global blocks in stage 3;</text>
<text x="28.0" y="769.0" font-size="11.5" text-anchor="start" fill="#5B6478">query pooling halves the resolution between stages. The high-resolution FPN levels skip the transformer and are added during upscaling. Memory attention and memory</text>
<text x="28.0" y="786.0" font-size="11.5" text-anchor="start" fill="#5B6478">encoder (7.5 M, for video) are in the checkpoint but not used for single images. Target: one binary 256 × 256 mask per structure and image.</text>
<rect x="28" y="805" width="14" height="12" rx="3" fill="#F3F1EC" stroke="#8A93A6"/>
