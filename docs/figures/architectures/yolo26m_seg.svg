<text x="28.0" y="742.0" font-size="11.5" text-anchor="start" fill="#5B6478">Ultralytics YOLO26m-seg: instance segmentation of pectoral muscle, breast tissue and nipple on the baseline640 canvas (MLO and CC in one model).</text>
<text x="28.0" y="759.0" font-size="11.5" text-anchor="start" fill="#5B6478">Each of the 8 400 cells predicts a box, 3 class scores and 32 mask coefficients; the instance mask is the coefficients times 32 prototype masks (sigmoid, cropped to the box).</text>
<text x="28.0" y="776.0" font-size="11.5" text-anchor="start" fill="#5B6478">One-to-one assignment keeps the top 300 instances without NMS; box regression is direct (reg_max 1). m scale: width 1.0, depth 0.5 (blocks once), at most 512 channels.</text>
<text x="28.0" y="793.0" font-size="11.5" text-anchor="start" fill="#5B6478">Parameters: 26.97 M. Dataset generations v1–v5 use this network (v4 is released). YOLO26l-seg (benchmark): same layout with the blocks repeated twice, 31.38 M.</text>
