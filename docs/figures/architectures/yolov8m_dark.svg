<text x="28.0" y="692.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">Ultralytics YOLOv8m with a decoupled anchor-free head: box sides as 16-bin distributions (DFL), class scores and, for segmentation, 32 mask coefficients per cell.</text>
<text x="28.0" y="709.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">Detections are filtered by non-maximum suppression. m scale: width 0.75, depth 0.67, at most 768 channels.</text>
<text x="28.0" y="726.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">YOLOv8m-seg (segmentation benchmark, 3 classes): 27.24 M parameters. YOLOv8l-seg: width 1.0, depth 1.0 (64-128-256-512-512 channels, C2f ×3/6/6/3), 45.94 M.</text>
<text x="28.0" y="743.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">Lesion detector: the same YOLOv8m backbone and neck with the Detect head (boxes + 2 classes, Mass / Calcification), trained at 1024 × 1024, 25.86 M.</text>
