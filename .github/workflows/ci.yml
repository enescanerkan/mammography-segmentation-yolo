name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -c constraints.txt -e ".[app,models,dicom,train,dev]" "PyQt5>=5.15" scikit-image
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Lint
        run: ruff check src tests tools
      - name: Package tests
        run: pytest -q
      - name: Annotation toolkit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tools/annotation/tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CPU image
        run: docker build -t mammography-segmentation:cpu .
      - name: Start without weights and check the health endpoint
        run: |
          docker run -d --name app -p 8000:8000 mammography-segmentation:cpu
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/health | python -c "import json,sys; d=json.load(sys.stdin); print(d['device'], d['errors'])"
          curl -fs -o /dev/null http://127.0.0.1:8000/
          docker logs app | tail -5
