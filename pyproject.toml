[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mammography-segmentation"
version = "1.0.0.dev0"
description = "Mammography breast / pectoral / nipple segmentation, landmark models and positioning assessment (PNL rule)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Enes Can Erkan", email = "eerkan20@posta.pau.edu.tr" }]
keywords = ["mammography", "segmentation", "pectoral muscle", "nipple", "posterior nipple line", "positioning", "YOLO"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.22",
  "opencv-python-headless>=4.6",
  "pyyaml>=6.0",
  "pandas>=1.4",
  "pydicom>=2.3",
  "PyWavelets>=1.4",
]

[project.optional-dependencies]
models = ["torch>=2.1", "ultralytics>=8.3"]
dicom = ["pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.1", "pylibjpeg-openjpeg>=2.1"]
app = ["fastapi>=0.100", "uvicorn>=0.22", "python-multipart>=0.0.6"]
desktop = ["pywebview>=5.3"]  # native window of the Windows build (packaging/windows)
train = ["albumentations>=1.3", "scikit-learn>=1.1", "tqdm>=4.65"]
segformer = ["transformers>=4.40", "timm>=1.0"]
nnunet = ["nnunetv2>=2.5"]
annotation = ["PyQt5>=5.15", "scikit-image>=0.21", "scipy>=1.10", "matplotlib>=3.5", "hydra-core>=1.3", "iopath>=0.1.10"]
dev = ["pytest>=7.0", "ruff==0.4.10", "httpx>=0.24"]

[project.scripts]
breast-seg = "breast_seg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
breast_seg = ["py.typed", "apps/positioning/static/**/*"]

[tool.ruff]
line-length = 130
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "B905", "UP006", "UP007", "UP035", "SIM108", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["weights: needs local model weights (configs/models.yaml); skipped otherwise"]
