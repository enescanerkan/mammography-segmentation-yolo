<text x="28.0" y="676.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">nnU-Net v2 residual-encoder U-Net, ResEnc-M preset, 2D configuration, plans of the trained model (patch = the whole 640 × 640 canvas, batch 12).</text>
<text x="28.0" y="693.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">Residual block = (3×3 conv, InstanceNorm, LeakyReLU) → (3×3 conv, InstanceNorm) + shortcut, LeakyReLU; the first block of a stage has stride 2 and an</text>
<text x="28.0" y="710.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">average-pool + 1×1 shortcut. Decoder: 2×2 transposed convolution, concatenated skip, one (3×3 conv, InstanceNorm, LeakyReLU). Every decoder level has a 1×1</text>
<text x="28.0" y="727.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">segmentation output (deep supervision during training; the full-resolution one at inference). Input: z-score normalised grey canvas. Parameters: 105.92 M.</text>
