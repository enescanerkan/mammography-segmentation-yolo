<rect width="100%" height="100%" rx="10" fill="#0D1117"/>
<text x="24.0" y="34.0" font-size="19" text-anchor="start" fill="#E6EAF2" font-weight="600">Prompted segmentation (annotation toolkit) · MedSAM2 fine-tune of SAM2 Hiera-tiny</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" fill="#9BA6BB">3 × 1024 × 1024 image + box  →  1 × 256 × 256 mask logits · 31.4 M parameters used (38.9 M in the checkpoint)</text>
<rect x="240" y="80" width="640" height="300" rx="9" fill="#131B2B" stroke="#253049"/>
<text x="252.0" y="99.0" font-size="10.5" text-anchor="start" fill="#9BA6BB" font-weight="600">IMAGE ENCODER</text>
<text x="868.0" y="99.0" font-size="10.5" text-anchor="end" fill="#9BA6BB">Hiera-T trunk 26.8 M + FPN neck 0.4 M</text>
<rect x="30" y="500" width="500" height="150" rx="9" fill="#131B2B" stroke="#253049"/>
<text x="42.0" y="519.0" font-size="10.5" text-anchor="start" fill="#9BA6BB" font-weight="600">PROMPT ENCODER (FROZEN)</text>
