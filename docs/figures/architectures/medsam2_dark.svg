<text x="40.0" y="139.5" font-size="11" text-anchor="start" fill="#9BA6BB">raw1024</text>
<rect x="260" y="110" width="130" height="50" rx="6" fill="#18264A" stroke="#8FA8D8" stroke-width="1.2"/>
