<text x="179.6" y="680.0" font-size="11" text-anchor="start" fill="#9BA6BB">attention / transformer</text>
<rect x="348.80000000000007" y="670" width="14" height="12" rx="3" fill="#0E3331" stroke="#4FB8B6"/>
<text x="368.8" y="680.0" font-size="11" text-anchor="start" fill="#9BA6BB">decoder / neck</text>
