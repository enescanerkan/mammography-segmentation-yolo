<text x="272.0" y="560.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">256 × 64 × 64 each</text>
<text x="272.0" y="573.5" font-size="11" text-anchor="start" fill="#9BA6BB">added to / used with the embedding</text>
<rect x="262" y="594" width="250" height="40" rx="6" fill="#1A2030" stroke="#6E788C" stroke-width="1.2"/>
<text x="272.0" y="611.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Sparse tokens</text>
<text x="272.0" y="625.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">3 × 256 (2 corners + pad)</text>
<rect x="50" y="586" width="175" height="56" rx="6" fill="#3B1E1B" stroke="#E07A6E" stroke-width="1.2"/>
<text x="60.0" y="604.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Box prompt</text>
<text x="60.0" y="619.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">(x0, y0, x1, y1)</text>
<text x="60.0" y="632.5" font-size="11" text-anchor="start" fill="#9BA6BB">2 corners, labels 2 / 3</text>
<rect x="580" y="536" width="200" height="60" rx="6" fill="#36290F" stroke="#E0A54A" stroke-width="1.2"/>
<text x="590.0" y="556.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Output tokens</text>
<text x="590.0" y="571.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">obj-score · IoU · 4 mask</text>
<text x="590.0" y="584.5" font-size="11" text-anchor="start" fill="#9BA6BB">+ prompt tokens</text>
<rect x="810" y="530" width="210" height="72" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="820.0" y="556.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Two-way transformer ×2</text>
<text x="820.0" y="571.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">256-d · 8 heads · MLP 2048</text>
<text x="820.0" y="584.5" font-size="11" text-anchor="start" fill="#9BA6BB">tokens ↔ image attention</text>
<rect x="1050" y="530" width="200" height="72" rx="6" fill="#0E3331" stroke="#4FB8B6" stroke-width="1.2"/>
<text x="1060.0" y="550.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Upscaling</text>
<text x="1060.0" y="564.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">ConvT ×2 → 64 × 128²</text>
<text x="1060.0" y="578.0" font-size="11" text-anchor="start" fill="#9BA6BB">+ s1, ConvT ×2 → 32 × 256²</text>
<text x="1060.0" y="591.0" font-size="11" text-anchor="start" fill="#9BA6BB">+ s0</text>
<rect x="810" y="632" width="210" height="58" rx="6" fill="#36290F" stroke="#E0A54A" stroke-width="1.2"/>
<text x="820.0" y="651.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Hypernetwork MLP</text>
<text x="820.0" y="666.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">mask token → 32 weights</text>
<text x="820.0" y="679.5" font-size="11" text-anchor="start" fill="#9BA6BB">IoU + object-score heads</text>
<rect x="1050" y="632" width="200" height="58" rx="6" fill="#1A2233" stroke="#7E899E" stroke-width="1.2"/>
<text x="1060.0" y="651.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Mask logits</text>
<text x="1060.0" y="666.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">1 × 256 × 256</text>
<text x="1060.0" y="679.5" font-size="11" text-anchor="start" fill="#9BA6BB">single mask (multimask off)</text>
