<text x="28.0" y="600.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">Each encoder block: efficient self-attention (keys and values spatially reduced by R with a strided convolution) and a Mix-FFN (MLP ratio 4 with a 3×3 depth-wise</text>
<text x="28.0" y="617.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">convolution instead of positional encodings); overlapping patch embeddings between stages. Configuration of the trained model (nvidia/mit-b3: depths 3-4-18-3,</text>
<text x="28.0" y="634.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">widths 64-128-320-512, drop path 0.1). Decoder: every stage projected to 768 channels, upsampled to 1/4 resolution, concatenated and fused; logits upsampled</text>
<text x="28.0" y="651.0" font-size="11.5" text-anchor="start" fill="#9BA6BB">bilinearly to the canvas. Prediction averages the softmax with the horizontally flipped pass.</text>
<rect x="28" y="670" width="14" height="12" rx="3" fill="#1A2233" stroke="#7E899E"/>
