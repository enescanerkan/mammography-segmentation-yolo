<text x="270.0" y="146.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">7×7, s4</text>
<rect x="410" y="110" width="210" height="60" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="420.0" y="130.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Stage 1 · 1 block</text>
<text x="420.0" y="145.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">96 × 256 × 256</text>
<text x="420.0" y="158.5" font-size="11" text-anchor="start" fill="#9BA6BB">window 8</text>
<rect x="410" y="200" width="210" height="60" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="420.0" y="220.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Stage 2 · 2 blocks</text>
<text x="420.0" y="235.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">192 × 128 × 128</text>
<text x="420.0" y="248.5" font-size="11" text-anchor="start" fill="#9BA6BB">window 4</text>
<rect x="650" y="110" width="210" height="60" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="660.0" y="130.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Stage 3 · 7 blocks</text>
<text x="660.0" y="145.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">384 × 64 × 64</text>
<text x="660.0" y="158.5" font-size="11" text-anchor="start" fill="#9BA6BB">window 14 · 3 global</text>
<rect x="650" y="200" width="210" height="60" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="660.0" y="220.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Stage 4 · 2 blocks</text>
<text x="660.0" y="235.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">768 × 32 × 32</text>
<text x="660.0" y="248.5" font-size="11" text-anchor="start" fill="#9BA6BB">window 7</text>
<rect x="410" y="290" width="450" height="70" rx="6" fill="#0E3331" stroke="#4FB8B6" stroke-width="1.2"/>
