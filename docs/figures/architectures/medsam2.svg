<text x="336.8" y="815.0" font-size="11" text-anchor="start" fill="#5B6478">attention / transformer</text>
<rect x="506.0" y="805" width="14" height="12" rx="3" fill="#E1F0EF" stroke="#0E7C7B"/>
<text x="526.0" y="815.0" font-size="11" text-anchor="start" fill="#5B6478">decoder / neck</text>
