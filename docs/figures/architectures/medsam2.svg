<rect x="159.60000000000002" y="805" width="14" height="12" rx="3" fill="#E7ECF5" stroke="#2A3B66"/>
<text x="179.6" y="815.0" font-size="11" text-anchor="start" fill="#5B6478">encoder / backbone</text>
