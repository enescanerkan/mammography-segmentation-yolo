<text x="28.0" y="540.0" font-size="11.5" text-anchor="start" fill="#5B6478">Attention U-Net (Oktay 2018) with CoordConv input: the grey canvas plus normalised x and y coordinate channels. Each skip is multiplied by an attention gate</text>
<text x="28.0" y="557.0" font-size="11.5" text-anchor="start" fill="#5B6478">α = σ(ψ(ReLU(W_g·g + W_x·x))) computed from the decoder signal g (1×1 convolutions, 256 / 128 / 64 / 32 intermediate channels) before concatenation.</text>
<text x="28.0" y="574.0" font-size="11.5" text-anchor="start" fill="#5B6478">Two 1×1 heads on the last decoder features: 4-class segmentation and one heatmap per landmark, read out by a spatial soft-argmax. Landmark arm: landmark loss only;</text>
<text x="28.0" y="591.0" font-size="11.5" text-anchor="start" fill="#5B6478">multitask arm: + segmentation loss through the shared network. Parameters: 31.39 M.</text>
