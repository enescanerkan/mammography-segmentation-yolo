<text x="1258.0" y="519.0" font-size="10.5" text-anchor="end" fill="#9BA6BB">4.2 M</text>
<rect x="30" y="96" width="190" height="50" rx="6" fill="#1A2233" stroke="#7E899E" stroke-width="1.2"/>
