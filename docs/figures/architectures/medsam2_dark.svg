<text x="420.0" y="330.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">levels kept: 256 × 256², 256 × 128², 256 × 64²</text>
<text x="420.0" y="343.5" font-size="11" text-anchor="start" fill="#9BA6BB">coarsest (32²) dropped (scalp 1)</text>
<rect x="240" y="410" width="290" height="60" rx="6" fill="#18264A" stroke="#8FA8D8" stroke-width="1.2"/>
<text x="250.0" y="430.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Image embedding</text>
<text x="250.0" y="445.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">256 × 64 × 64</text>
<text x="250.0" y="458.5" font-size="11" text-anchor="start" fill="#9BA6BB">64² level + no-memory embedding</text>
