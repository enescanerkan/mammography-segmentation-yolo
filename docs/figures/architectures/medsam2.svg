<text x="657.6" y="815.0" font-size="11" text-anchor="start" fill="#5B6478">head</text>
<rect x="705.2" y="805" width="14" height="12" rx="3" fill="#F6E3E0" stroke="#B03A2E"/>
<text x="725.2" y="815.0" font-size="11" text-anchor="start" fill="#5B6478">conditioning</text>
<rect x="824.0" y="805" width="14" height="12" rx="3" fill="#EEF0F3" stroke="#8A93A6"/>
