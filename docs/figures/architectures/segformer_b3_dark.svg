<rect width="100%" height="100%" rx="10" fill="#0D1117"/>
<text x="24.0" y="34.0" font-size="19" text-anchor="start" fill="#E6EAF2" font-weight="600">Semantic segmentation · SegFormer-B3</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" fill="#9BA6BB">3 × 640 × 640 canvas  →  4 × 640 × 640 class logits · 47.2 M parameters (encoder 44.1 M, decoder 3.2 M)</text>
<rect x="20" y="150" width="420" height="420" rx="9" fill="#131B2B" stroke="#253049"/>
<text x="32.0" y="169.0" font-size="10.5" text-anchor="start" fill="#9BA6BB" font-weight="600">MIT-B3 ENCODER</text>
<text x="428.0" y="169.0" font-size="10.5" text-anchor="end" fill="#9BA6BB">hierarchical transformer</text>
<rect x="470" y="150" width="750" height="420" rx="9" fill="#131B2B" stroke="#253049"/>
<text x="482.0" y="169.0" font-size="10.5" text-anchor="start" fill="#9BA6BB" font-weight="600">ALL-MLP DECODER</text>
<rect x="40" y="92" width="300" height="44" rx="6" fill="#1A2233" stroke="#7E899E" stroke-width="1.2"/>
<text x="50.0" y="111.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Input</text>
<text x="50.0" y="125.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">3 × 640 × 640 (grey ×3, ImageNet norm.)</text>
<rect x="40" y="182" width="380" height="66" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="50.0" y="205.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Stage 1 · patch embed 7×7, s4</text>
<text x="50.0" y="220.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">64 × 160 × 160</text>
<text x="50.0" y="233.5" font-size="11" text-anchor="start" fill="#9BA6BB">3 blocks · 1 head · reduction R = 8</text>
<text x="411.0" y="240.0" font-size="10.5" text-anchor="end" fill="#A98BDB" font-weight="600">/4</text>
<rect x="40" y="278" width="380" height="66" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="50.0" y="301.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Stage 2 · patch embed 3×3, s2</text>
<text x="50.0" y="316.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">128 × 80 × 80</text>
<text x="50.0" y="329.5" font-size="11" text-anchor="start" fill="#9BA6BB">4 blocks · 2 heads · R = 4</text>
<text x="411.0" y="336.0" font-size="10.5" text-anchor="end" fill="#A98BDB" font-weight="600">/8</text>
<rect x="40" y="374" width="380" height="66" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="50.0" y="397.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Stage 3 · patch embed 3×3, s2</text>
<text x="50.0" y="412.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">320 × 40 × 40</text>
<text x="50.0" y="425.5" font-size="11" text-anchor="start" fill="#9BA6BB">18 blocks · 5 heads · R = 2</text>
<text x="411.0" y="432.0" font-size="10.5" text-anchor="end" fill="#A98BDB" font-weight="600">/16</text>
<rect x="40" y="470" width="380" height="66" rx="6" fill="#2A2240" stroke="#A98BDB" stroke-width="1.2"/>
<text x="50.0" y="493.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Stage 4 · patch embed 3×3, s2</text>
<text x="50.0" y="508.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">512 × 20 × 20</text>
<text x="50.0" y="521.5" font-size="11" text-anchor="start" fill="#9BA6BB">3 blocks · 8 heads · R = 1</text>
<text x="411.0" y="528.0" font-size="10.5" text-anchor="end" fill="#A98BDB" font-weight="600">/32</text>
<rect x="500" y="191" width="230" height="48" rx="6" fill="#0E3331" stroke="#4FB8B6" stroke-width="1.2"/>
<text x="510.0" y="212.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Linear 64 → 768</text>
<text x="510.0" y="226.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">↑ to 768 × 160 × 160</text>
<rect x="500" y="287" width="230" height="48" rx="6" fill="#0E3331" stroke="#4FB8B6" stroke-width="1.2"/>
<text x="510.0" y="308.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Linear 128 → 768</text>
<text x="510.0" y="322.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">↑ to 768 × 160 × 160</text>
<rect x="500" y="383" width="230" height="48" rx="6" fill="#0E3331" stroke="#4FB8B6" stroke-width="1.2"/>
<text x="510.0" y="404.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Linear 320 → 768</text>
<text x="510.0" y="418.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">↑ to 768 × 160 × 160</text>
<rect x="500" y="479" width="230" height="48" rx="6" fill="#0E3331" stroke="#4FB8B6" stroke-width="1.2"/>
<text x="510.0" y="500.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Linear 512 → 768</text>
<text x="510.0" y="514.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">↑ to 768 × 160 × 160</text>
<circle cx="790" cy="345" r="14" fill="#0E3331" stroke="#4FB8B6" stroke-width="1.2"/><text x="790.0" y="349.5" font-size="13" text-anchor="middle" fill="#E6EAF2" font-weight="600">C</text>
<rect x="830" y="300" width="170" height="90" rx="6" fill="#0E3331" stroke="#4FB8B6" stroke-width="1.2"/>
<text x="840.0" y="329.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Fuse</text>
<text x="840.0" y="343.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">3072 → 768</text>
<text x="840.0" y="357.0" font-size="11" text-anchor="start" fill="#9BA6BB">1×1 conv, BN, ReLU</text>
<text x="840.0" y="370.0" font-size="11" text-anchor="start" fill="#9BA6BB">dropout 0.1</text>
<rect x="1030" y="300" width="170" height="90" rx="6" fill="#36290F" stroke="#E0A54A" stroke-width="1.2"/>
<text x="1040.0" y="329.0" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Classifier</text>
<text x="1040.0" y="343.5" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">1×1 conv → 4</text>
<text x="1040.0" y="357.0" font-size="11" text-anchor="start" fill="#9BA6BB">4 × 160 × 160</text>
<text x="1040.0" y="370.0" font-size="11" text-anchor="start" fill="#9BA6BB">(1/4 resolution)</text>
<rect x="1030" y="470" width="170" height="66" rx="6" fill="#1A2233" stroke="#7E899E" stroke-width="1.2"/>
<text x="1040.0" y="493.5" font-size="12.5" text-anchor="start" fill="#E6EAF2" font-weight="600">Output</text>
<text x="1040.0" y="508.0" font-size="11" text-anchor="start" fill="#9BA6BB" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">4 × 640 × 640</text>
<text x="1040.0" y="521.5" font-size="11" text-anchor="start" fill="#9BA6BB">bilinear ×4</text>
